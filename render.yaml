services:
  - type: web
    name: jas-portfolio
    runtime: static
    buildCommand: echo "Static site - no build step"
    staticPublishPath: ./
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /projects
        name: Cache-Control
        value: no-cache
      - path: /projects.html
        name: Cache-Control
        value: no-cache
      - path: /privacy
        name: Cache-Control
        value: no-cache
      - path: /privacy.html
        name: Cache-Control
        value: no-cache
      - path: /404.html
        name: Cache-Control
        value: no-cache
      - path: /css/*
        name: Cache-Control
        value: no-cache
      - path: /js/*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: no-cache
      - path: /site.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /sitemap.xml
        name: Cache-Control
        value: no-cache
      - path: /robots.txt
        name: Cache-Control
        value: no-cache
      - path: /assets/James-Albert-Salva-Resume-2026.pdf
        name: Content-Disposition
        value: attachment; filename="James-Albert-Salva-Resume-2026.pdf"
      - path: /resume.pdf
        name: Content-Disposition
        value: attachment; filename="James-Albert-Salva-Resume-2026.pdf"
    routes:
      - type: rewrite
        source: /resume
        destination: /assets/James-Albert-Salva-Resume-2026.pdf
      - type: rewrite
        source: /resume.pdf
        destination: /assets/James-Albert-Salva-Resume-2026.pdf
      - type: rewrite
        source: /projects
        destination: /projects.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
